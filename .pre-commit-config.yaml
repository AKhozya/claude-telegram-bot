# One-time setup per clone: pre-commit install
# (installs both hook types via default_install_hook_types below)
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # --write instead of --check: the commit fails once, but the files are
      # already fixed — re-stage and re-commit, no manual format step.
      - id: prettier
        name: prettier (staged files)
        entry: bunx prettier --write --ignore-unknown
        language: system

      - id: gitleaks
        name: gitleaks (staged diff)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false

      - id: typecheck
        name: bun typecheck
        entry: bun run typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: test
        name: bun test
        entry: bun test
        language: system
        pass_filenames: false
        stages: [pre-push]
